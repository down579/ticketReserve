spring:
  application:
    name: ticketReserve
  datasource:
    url: jdbc:mysql://localhost:3306/ticket_reserve?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: "!@tngkr304"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
  data:
    redis:
      host: localhost
      port: 6379

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

ticket:
  session:
    ttl-minutes: 10
  seat-hold:
    ttl-minutes: 7
  seat-map:
    cache-enabled: "false"
    ttl-seconds: 3

server:
  tomcat:
    max-connections: 20000
    accept-count: 2000

spring.threads.virtual.enabled: true
